<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const stage=document.getElementById('stage'),status=document.getElementById('status'),stats=document.getElementById('stats');
const scene=new THREE.Scene();const cam=new THREE.PerspectiveCamera(38,1,.01,120);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
stage.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x554054,2.7));
const key=new THREE.DirectionalLight(0xffe3c6,3);key.position.set(4,7,8);scene.add(key);
const rim=new THREE.DirectionalLight(0x9ab6ff,2);rim.position.set(-4,5,-7);scene.add(rim);
const orbit=new OrbitControls(cam,renderer.domElement);orbit.enableDamping=true;orbit.minDistance=.5;orbit.maxDistance=35;
let root=null,shoulder=null,morphMeshes=[],baseQuaternion=null,center=new THREE.Vector3(),radius=2,auto=false;
function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight);cam.aspect=stage.clientWidth/stage.clientHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
function view(v){
 const d=radius*2.4,angles={front:[0,.3,d],side:[d,.3,0],back:[0,.3,-d],three:[d*.68,d*.15,d*.68]};
 const a=angles[v]||angles.three;
 cam.position.copy(center).add(new THREE.Vector3(...a));orbit.target.copy(center);orbit.update();
}
document.querySelectorAll('[data-view]').forEach(x=>x.addEventListener('click',()=>view(x.dataset.view)));
document.getElementById('turn').onclick=()=>{
 auto=!auto;orbit.autoRotate=auto;document.getElementById('turn').textContent='自动旋转：'+(auto?'开':'关')
};
const morphInput=document.getElementById('morph'),shoulderInput=document.getElementById('shoulder');
function setMorph(n){for(const m of morphMeshes){for(const [name,index] of Object.entries(m.morphTargetDictionary||{}))if(name.includes('R36_PixalGuide'))m.morphTargetInfluences[index]=n}
 document.getElementById('morph-out').textContent=Math.round(n*100)+'%';
}
function setShoulder(deg){if(shoulder&&baseQuaternion){shoulder.quaternion.copy(baseQuaternion).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),deg*Math.PI/180))}
 document.getElementById('shoulder-out').textContent=deg+'°';
}
morphInput.addEventListener('input',()=>setMorph(+morphInput.value/100));
shoulderInput.addEventListener('input',()=>setShoulder(+shoulderInput.value));
document.getElementById('reset').onclick=()=>{morphInput.value=100;shoulderInput.value=0;setMorph(1);setShoulder(0);view('three')};
window.__R36_QA={loaded:false};
new GLTFLoader().load('./candidate/R36_parametric_rig_pixal_guided_torso.glb',g=>{
 root=g.scene;scene.add(root);
 let bones=0,tris=0;const boneNames=[];
 root.traverse(o=>{if(o.isBone){bones++;boneNames.push(o.name);if(/shoulder/i.test(o.name)&&/[._-]L$|left/i.test(o.name))shoulder=o}
 if(o.isMesh){const geo=o.geometry;tris+=Math.floor((geo.index?geo.index.count:geo.attributes.position.count)/3);
 if(o.morphTargetInfluences?.length)morphMeshes.push(o)}
 });
 if(!shoulder)shoulder=root.getObjectByName('shoulder01L')||root.getObjectByName('shoulder01_L')||null;

 radius=Math.max(bounds.getSize(new THREE.Vector3()).length()*.63,1);
 view('three');setMorph(1);
 const morphNames=morphMeshes.flatMap(m=>Object.keys(m.morphTargetDictionary||{}));
 const bs=bounds.getSize(new THREE.Vector3());
 const cp=cam.position.toArray();
 const bb={min:bounds.min.toArray(),max:bounds.max.toArray(),size:bs.toArray()};
 window.__R36_DEBUG={scene,root,cam,renderer,orbit,bounds};

 stats.textContent='三角面 '+tris.toLocaleString()+' · 骨骼 '+bones+' · 形变目标 '+morphNames.length;
 status.textContent='真实混合GLB已加载 · 上身可调 · ART_APPROVED=false';
 window.__R36_QA={loaded:true,bones,triangles:tris,morphNames,shoulderFound:!!shoulder,boneSamples:boneNames.filter(x=>/shoulder|arm/i.test(x)).slice(0,15),rigged:true,artApproved:false,bounds:bb,cameraPosition:cp};
},undefined,err=>{status.textContent='模型载入失败：'+err.message;window.__R36_QA={loaded:false,error:String(err)}});
renderer.setAnimationLoop(()=>{orbit.update();renderer.render(scene,cam)});
</script></body></html>
