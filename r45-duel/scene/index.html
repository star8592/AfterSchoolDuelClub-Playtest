<!DOCTYPE html><html lang="zh-Hans"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>R45 真实三维决斗体育馆</title>
<script type="importmap">{"imports":{"three":"../assets/three/build/three.module.js","three/addons/":"../assets/three/examples/jsm/"}}</script>
<style>
html,body{width:100%;height:100%;overflow:hidden;margin:0;background:#17283b}
canvas{display:block;width:100%;height:100%}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#15253bdc;color:#ffe4b6;font:13px system-ui,sans-serif;text-align:center;padding:12px;z-index:8}
#loading[hidden]{display:none}
#loading[data-error="true"]{background:#15253bf0}
#loading .load-error{max-width:560px;line-height:1.6;overflow-wrap:anywhere}
#load-progress{width:min(370px,82vw);height:12px;accent-color:#f7c87f}
#load-progress[hidden]{display:none}
#load-count{font:800 17px system-ui,sans-serif;color:#ffe0a3}
#load-explain{font:12px system-ui,sans-serif;color:#bad0d8;max-width:min(460px,84vw);line-height:1.7}
#retry-scene{padding:12px 23px;min-height:48px;min-width:170px;
 border:1px solid #ffe6ad;border-radius:10px;background:#f2bf72;color:#15263d;
 font:800 16px system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 20px #0007}
#retry-scene:hover{filter:brightness(1.10)}#retry-scene:focus-visible{outline:3px solid #fff}

#info{position:absolute;top:9px;left:10px;z-index:3;padding:5px 10px;border:1px solid #d2b58577;background:#14243bc8;color:#fbe3bb;border-radius:7px;font:11px system-ui,sans-serif}
#details,#identity,#identity-left,#identity-right,#replay,#evidence{display:none}
#impact{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-weight:900;font:900 clamp(16px,3vw,34px) system-ui,sans-serif;color:#fff0d4;text-shadow:0 4px 14px #000,0 0 20px #fd875f;z-index:4}
#impact[hidden]{display:none}
/* R100: scene-native, transient three-phase combo label and skip control.
   Nothing overlays the hand/camera UI; hide completely outside real combos. */
#combo-cinematic{position:absolute;top:30%;left:50%;transform:translateX(-50%);
 z-index:5;display:flex;align-items:center;gap:9px;justify-content:center;
 pointer-events:none;max-width:min(90%,510px);border-radius:11px;
 padding:8px 11px;background:#092535d9;border:1px solid #eac991c9;
 box-shadow:0 5px 25px #07192988;color:#fff1d9;font-family:system-ui,sans-serif}
#combo-cinematic[hidden]{display:none}
#combo-caption{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:center}
#combo-caption[hidden]{display:none}
#combo-caption strong{font-size:clamp(13px,1.4vw,17px);white-space:nowrap}
#combo-caption span{font-size:clamp(11px,1.05vw,13px);color:#c8e7f8;white-space:nowrap}
#skip-combo{pointer-events:auto;border:1px solid #b6cbd7;border-radius:7px;
 background:#33586c;color:#fff1cd;font:700 11px system-ui,sans-serif;
 min-height:31px;padding:5px 9px;white-space:nowrap;cursor:pointer}
#skip-combo[hidden]{display:none}
#skip-combo:hover{background:#426d83}
@media(max-width:600px){
 #combo-cinematic{top:35%;max-width:95%;padding:5px 7px;gap:5px}
 #combo-caption strong{font-size:12px}
 #combo-caption span{font-size:10px}
 #skip-combo{min-height:30px;padding:3px 6px;font-size:10px}
}

</style></head><body>
<canvas id="battle-canvas" aria-label="真正的三维体育馆：双方决斗者站台与中央召唤竞技场"></canvas>
<div id="info"><strong id="phase">准备竞技场</strong><span id="details"></span></div>
<span id="identity"></span><span id="identity-left"></span><span id="identity-right"></span><span id="evidence"></span>
<div id="impact" hidden>命中</div><button id="replay" hidden></button>
<div id="combo-cinematic" role="status" aria-live="polite" hidden>
  <span id="combo-caption" hidden></span>
  <button id="skip-combo" type="button" hidden>跳过演出</button>
</div>
<div id="loading" role="status">
  <strong>正在载入真实三维人物与体育馆</strong>
  <span id="load-count">已完成 0 / 14 个三维人物资源</span>
  <progress id="load-progress" value="0" max="14" aria-label="已验证的三维模型加载进度">0/14</progress>
  <span id="load-explain">首次需要较大的模型文件；只在实际模型完整加载并验证通过后累计。请使用稳定网络，出牌前会严格检查。</span>
</div>
<script type="module" src="./scene.mjs"></script>
</body></html>
