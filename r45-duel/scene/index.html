<style>
html,body{width:100%;height:100%;overflow:hidden;margin:0;background:#17283b}
canvas{display:block;width:100%;height:100%}
/* R114: light CSS-only presentation. No extra opening-screen images or fonts. */
#loading{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
 padding:clamp(14px,3vw,36px);overflow:hidden;isolation:isolate;color:#fff1d7;
 background:radial-gradient(ellipse at 49% 25%,#2d4862 0%,#14283f 43%,#091522 90%);
 font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;text-align:center}
#loading::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.26;
 background:repeating-linear-gradient(0deg,transparent 0 48px,#83a4bd36 49px 50px),
 repeating-linear-gradient(90deg,transparent 0 48px,#83a4bd36 49px 50px);
 transform:perspective(340px) rotateX(34deg) scale(1.8);transform-origin:center 80%}
#loading::after{content:"";position:absolute;left:50%;top:48%;width:min(88vmin,700px);
 aspect-ratio:1;border:1px solid #cbb18720;border-radius:50%;transform:translate(-50%,-50%);
 box-shadow:0 0 0 56px #cbb18708,0 0 0 110px #cbb18706;z-index:-1}
#loading[hidden]{display:none}
#loading[data-error="true"]{background:#101f30}
.load-shell{width:min(100%,490px);position:relative;display:flex;align-items:center;
 flex-direction:column;gap:0;padding:clamp(25px,4vw,37px) clamp(21px,4vw,39px);
 background:linear-gradient(145deg,#18324ce8 0%,#101d2eeb 72%,#0d1b2aeb 100%);
 border:1px solid #9bc7d050;border-top:2px solid #e9c58d;
 border-radius:22px;box-shadow:0 26px 72px #0009,inset 0 0 0 1px #ffffff09}
.load-eyebrow{font:700 10px/1.6 system-ui,sans-serif;letter-spacing:.31em;
 text-transform:uppercase;color:#b9d6dc}
.load-emblem{position:relative;width:90px;height:90px;display:grid;place-items:center;
 margin:18px 0 15px;border-radius:50%;background:radial-gradient(circle,#284560 2%,#182b40 67%);
 border:1px solid #e4c58b8c;box-shadow:0 0 0 8px #e7c78d10,0 0 26px #ead19c26}
.load-emblem::before{content:"";position:absolute;inset:-9px;border:2px solid transparent;
 border-top-color:#f6d799;border-left-color:#e4c58b70;border-radius:50%;animation:arena-orbit 6s linear infinite}
.load-emblem strong{font:bold 31px/1 Georgia,serif;letter-spacing:-.09em;color:#ffe3ac;
 text-shadow:0 3px 12px #030d17}
.load-emblem small{position:absolute;bottom:19px;font:800 7px system-ui,sans-serif;
 color:#bce8e2;letter-spacing:.3em}
.load-title{margin:0;font-size:clamp(25px,4.3vw,36px);font-weight:900;
 letter-spacing:.08em;line-height:1.27;color:#fff2d9;text-shadow:0 4px 15px #0006}
.load-subtitle{font:700 11px/2 system-ui,sans-serif;color:#e8ca91;letter-spacing:.2em;margin-top:4px}
.load-rule{height:1px;width:100%;background:linear-gradient(90deg,transparent,#d4b67c70,transparent);margin:20px 0}
#load-step{font-weight:750;font-size:14px;line-height:1.4;color:#d9f0f2;min-height:20px}
.load-progress-head{width:100%;display:flex;justify-content:space-between;align-items:baseline;
 gap:8px;margin:15px 0 9px;color:#b9cad5;font:650 11px system-ui,sans-serif}
#load-count{font:750 12px system-ui,sans-serif;color:#ffe2a8;font-variant-numeric:tabular-nums}
#load-progress{width:100%;height:9px;display:block;appearance:none;-webkit-appearance:none;
 border:0;border-radius:999px;background:#2c4253;overflow:hidden}
#load-progress::-webkit-progress-bar{background:#2c4253;border-radius:999px}
#load-progress::-webkit-progress-value{border-radius:999px;background:linear-gradient(90deg,#5bd9cf,#e9c58d);
 transition:width .24s ease}
#load-progress::-moz-progress-bar{border-radius:999px;background:linear-gradient(90deg,#5bd9cf,#e9c58d)}
#load-progress[hidden]{display:none}
#load-explain{font:12px/1.65 system-ui,sans-serif;color:#b4c8d3;margin:14px 0 0;max-width:370px}
#load-download{color:#9bcad9;font:700 11px/1.5 system-ui,sans-serif;margin:10px 0 0;font-variant-numeric:tabular-nums}
#load-slow[hidden]{display:none}#load-slow{font:11px/1.7 system-ui,sans-serif;color:#f4d7ae;margin-top:12px}
#load-retry-slow{background:transparent;border:1px solid #e7c18b8c;border-radius:7px;padding:5px 10px;margin-left:6px;color:#ffe3ab;cursor:pointer;font:700 11px system-ui,sans-serif}
#load-retry-slow:focus-visible{outline:2px solid #fff}
.load-tip{width:100%;margin-top:22px;padding:13px 13px 0;border-top:1px solid #c8d5d21d;
 color:#d8d3ba;font:11px/1.7 system-ui,sans-serif}
.load-tip b{color:#f0d392}
#loading .load-error{width:100%;margin-top:15px;border:1px solid #e3aa8b55;
 background:#3a293344;padding:12px;border-radius:9px;font:12px/1.6 system-ui,sans-serif;
 color:#ffddd0;overflow-wrap:anywhere}
#retry-scene{margin-top:14px;padding:12px 23px;min-height:48px;min-width:170px;
 border:1px solid #ffe6ad;border-radius:10px;background:#f2bf72;color:#15263d;
 font:800 15px system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 20px #0007}
#retry-scene:hover{filter:brightness(1.10)}#retry-scene:focus-visible{outline:3px solid #fff}
@keyframes arena-orbit{to{transform:rotate(360deg)}}
@media(max-width:520px){.load-shell{padding:22px 20px;border-radius:16px}.load-emblem{width:72px;height:72px;margin:11px 0 12px}.load-emblem strong{font-size:27px}.load-emblem small{bottom:12px}.load-rule{margin:15px 0}.load-tip{margin-top:14px}.load-title{font-size:26px}}
@media(prefers-reduced-motion:reduce){.load-emblem::before{animation:none}#load-progress::-webkit-progress-value{transition:none}}

#info{position:absolute;top:9px;left:10px;z-index:3;padding:5px 10px;border:1px solid #d2b58577;background:#14243bc8;color:#fbe3bb;border-radius:7px;font:11px system-ui,sans-serif}
#details,#identity,#identity-left,#identity-right,#replay,#evidence{display:none}
/* R121: refined physical-camera inset frame. A single scene + one GPU
   canvas, not a fake 2D portrait. Never takes pointer or keyboard focus. */
#hero-portrait-frame{position:fixed;z-index:4;pointer-events:none;box-sizing:border-box;
 border:2px solid #efd59f;border-radius:9px;overflow:hidden;
 box-shadow:0 9px 28px #061521c7,0 0 0 3px #14283ecb,inset 0 0 18px #fae0b322;
 transition:opacity .13s linear}
#hero-portrait-frame[hidden]{display:none}
#hero-portrait-frame[data-side=ai]{border-color:#96d5eb;box-shadow:
 0 9px 28px #061521c7,0 0 0 3px #14283ecb,inset 0 0 18px #93d5e222}
#hero-portrait-caption{position:absolute;top:5px;left:6px;
 display:block;max-width:calc(100% - 12px);padding:3px 7px;
 background:#0c233ad9;color:#ffebc0;border:1px solid #d4b67c88;
 font:800 clamp(9px,.95vw,11px)/1.35 system-ui,"Noto Sans SC",sans-serif;
 letter-spacing:.06em;border-radius:5px;white-space:nowrap;
 text-shadow:0 1px 4px #020812}
#hero-portrait-frame[data-side=ai] #hero-portrait-caption{color:#cef4ff;border-color:#9bd8e888}
#impact{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-weight:900;font:900 clamp(16px,3vw,34px) system-ui,sans-serif;color:#fff0d4;text-shadow:0 4px 14px #000,0 0 20px #fd875f;z-index:4}
#impact[hidden]{display:none}
/* R100: scene-native, transient three-phase combo label and skip control.
   Nothing overlays the hand/camera UI; hide completely outside real combos. */
#combo-cinematic{position:absolute;top:30%;left:50%;transform:translateX(-50%);
 z-index:5;display:flex;align-items:center;gap:9px;justify-content:center;
 pointer-events:none;max-width:min(90%,510px);border-radius:11px;
 padding:8px 11px;background:#092535d9;border:1px solid #eac991c9;
 box-shadow:0 5px 25px #07192988;color:#fff1d9;font-family:system-ui,sans-serif}
#combo-cinematic[hidden]{display:none}
#combo-caption{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:center}
#combo-caption[hidden]{display:none}
#combo-caption strong{font-size:clamp(13px,1.4vw,17px);white-space:nowrap}
#combo-caption span{font-size:clamp(11px,1.05vw,13px);color:#c8e7f8;white-space:nowrap}
#skip-combo{pointer-events:auto;border:1px solid #b6cbd7;border-radius:7px;
 background:#33586c;color:#fff1cd;font:700 11px system-ui,sans-serif;
 min-height:31px;padding:5px 9px;white-space:nowrap;cursor:pointer}
#skip-combo[hidden]{display:none}
#skip-combo:hover{background:#426d83}
@media(max-width:600px){
 #combo-cinematic{top:35%;max-width:95%;padding:5px 7px;gap:5px}
 #combo-caption strong{font-size:12px}
 #combo-caption span{font-size:10px}
 #skip-combo{min-height:30px;padding:3px 6px;font-size:10px}
}

</style></head><body>
