<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="dark"><link rel="icon" href="data:,">
<title>R90 三维对战动作实测｜放学后决斗社</title><style>
:root{color-scheme:dark;--bg:#101f2a;--border:#607b7d88;--gold:#ffdba0;--mint:#9fded0;--text:#fff4dd}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#213848 0%,#0d1b28 48%,#071520);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Noto Sans SC",sans-serif;min-height:100vh}button{font:inherit;cursor:pointer;border-radius:9px}header{padding:17px clamp(14px,3vw,42px);display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #91a9a636}header h1{margin:0;font-size:clamp(19px,2.2vw,28px);letter-spacing:.03em}header p{margin:2px 0 0;color:#b8cbd0;font-size:12px}header a{color:var(--gold);text-decoration:none;border:1px solid #b6a07f88;border-radius:8px;padding:8px 12px;white-space:nowrap}.layout{max-width:1550px;margin:0 auto;padding:16px clamp(12px,2.5vw,37px);display:grid;grid-template-columns:minmax(240px,292px) minmax(0,1fr);gap:16px}.panel{padding:16px;border:1px solid var(--border);background:#122a39dd;border-radius:16px}.panel h2{font-size:14px;margin:2px 0 12px;color:var(--gold)}.roles{display:grid;gap:7px}.role{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;color:#e8f2ed;background:#244352;border:1px solid #587c86;padding:10px 12px}.role small{color:#a8c4c9;font-size:11px}.role[aria-pressed=true]{background:#476070;border-color:#f1c884;color:#ffe5b4;box-shadow:inset 3px 0 #ffd28c}.legend{border-top:1px solid #718e9257;padding-top:11px;margin-top:15px;font-size:12px;color:#adcbd3}.legend strong{color:#ffe4bc}.stage{min-width:0;display:flex;flex-direction:column;gap:12px}.arena{height:min(71vh,740px);min-height:430px;position:relative;overflow:hidden;border-radius:16px;background:#0e2030;border:1px solid var(--border)}iframe{border:0;width:100%;height:100%;display:block}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#132839ed;color:#f9dca9;font-weight:700;z-index:2;padding:20px;text-align:center}.loading[hidden]{display:none}.banner{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);pointer-events:none;font-weight:800;padding:7px 16px;border:1px solid #baa26d77;border-radius:40px;background:#102335d9;color:#f6dfb5;max-width:90%;text-align:center}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px}.fire{border:1px solid #ffd695;color:#211e1a;background:linear-gradient(#ffdc9a,#dea76a);font-weight:900;padding:12px 22px}.fire:disabled{opacity:.45;cursor:default}.secondary{background:#274557;color:#ebf4f2;border:1px solid #729a9d;padding:11px 15px}.secondary[aria-pressed=true]{color:#ffdc94;border-color:#e4bd74;background:#44515b}.sound{display:flex;gap:7px;align-items:center;margin-left:auto;color:#d1e6e0;white-space:nowrap}.sound input{accent-color:#e1b77d}.msg{font-size:12px;color:#b1cbd2;margin:0}.status{font-size:12px;border:1px solid #5c7f8565;background:#172f3c;border-radius:9px;padding:8px 11px;color:#d2e2df} @media(max-width:820px){.layout{grid-template-columns:minmax(0,1fr);gap:10px;padding:10px}.panel{padding:11px}.roles{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px}.role{min-width:126px;display:flex;flex-direction:column;align-items:start;gap:0;padding:8px 10px}.legend{margin:8px 0 0}.arena{height:53vh;min-height:320px}.actions{gap:7px}.fire{padding:9px 13px}.secondary{padding:9px 11px}.sound{margin-left:0}.status{width:100%}}
</style></head><body><header><div><h1>R90 · 三维战斗动作实测</h1><p>七位真实 GLB 人物 · 事件驱动攻防 · 可切换 R89 旧版时间轴</p></div><a href="./">返回正式游戏</a></header>
<div class="layout"><aside class="panel"><h2>选择出战人物</h2><div class="roles" id="roles" role="group" aria-label="选择战斗人物"></div><p class="legend">场内使用正式游戏的<strong>真实 3D 竞技场、同一套人物、召唤系统与攻防事件表现</strong>。这只是独立的战斗表现测试；伤害为模拟事件，不影响正式对局积分。</p></aside>
<main class="stage"><div class="arena"><iframe id="arena" title="三维竞技场真实攻防动作预览" loading="eager" src="./scene/?qa=1&r90Motion=on"></iframe><div class="loading" id="loading" role="status">正在加载竞技场与 12 种三维召唤资产…</div><div class="banner" id="banner">R90 · 真实命中后才触发受击</div></div>
<div class="panel actions"><button id="fire" class="fire" disabled>出招 · 真实攻防演示</button><button id="combo" class="secondary" disabled>连续三击</button><button id="mode" class="secondary" aria-pressed="true">R90 新版动作</button><label class="sound"><input id="sound" type="checkbox" checked>音效开启</label><div id="status" class="status">正在初始化…</div></div><p class="msg">比较建议：先看 R90 的命中时点、人物受击和退让，再点击“R90 新版动作”切换至 R89 旧版。可用同一角色反复比较。</p></main></div>
<script>
const roles=[['E03','加油队长','Ellie'],['E04','食堂接力员','Phil'],['G02','黑板密码专家','Snow'],['G03','实验学长','Jay'],['G04','社团计划总监','Victoria'],['T03','默契收发员','Rain'],['T04','活动室守门人','Rex']];
const el=id=>document.getElementById(id),arena=el('arena'),roleButtons=el('roles'),status=el('status'),banner=el('banner'),fire=el('fire'),combo=el('combo'),modeButton=el('mode');
let role='E03',mode='on',ready=false,busy=false,lastImpactCount=0,lastImpactIndex=-1,serial=90100,audio=null;
const profiles={E03:300,E04:145,G02:230,G03:210,G04:260,T03:310,T04:115};
const qa=window.__R90_SHOWCASE_QA={ready:false,role,mode,started:0,completed:0,impacts:0,error:null};
function scene(){try{return arena.contentWindow?.__r45SceneQA||null}catch{return null}}
function send(msg){arena.contentWindow?.postMessage(msg,location.origin)}
function choose(id){if(busy)return;role=id;qa.role=id;document.querySelectorAll('.role').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.id===id)));if(ready)drawBoard();banner.textContent=roles.find(x=>x[0]===id)[1]+' · '+(mode==='on'?'R90 命中同步':'R89 旧版同步')}
function matchup(){const target=role==='T04'?'E03':'T04';const pre={player:[{id:role,uid:'U101',hp:10,attack:3,shield:0}],ai:[{id:target,uid:'U201',hp:10,attack:2,shield:0}]};return{target,pre}}
function drawBoard(){const {pre}=matchup();send({type:'ASDC_R45_BOARD',player:pre.player.map(x=>x.id),ai:pre.ai.map(x=>x.id),units:pre})}
function getAudio(){if(!el('sound').checked)return null;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}catch{return null}}
function whoosh(){const ctx=getAudio();if(!ctx)return;const osc=ctx.createOscillator(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();osc.type='sawtooth';osc.frequency.setValueAtTime(95,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(420,ctx.currentTime+.26);filter.type='lowpass';filter.frequency.setValueAtTime(600,ctx.currentTime);filter.frequency.linearRampToValueAtTime(2100,ctx.currentTime+.22);gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.045,ctx.currentTime+.08);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.31);osc.connect(filter).connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.32)}
function impactSound(){const ctx=getAudio();if(!ctx)return;let f=profiles[role]||180;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='triangle';osc.frequency.setValueAtTime(f,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(f*.33,ctx.currentTime+.16);gain.gain.setValueAtTime(.19,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.19);osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.2)}
function play(count){if(!ready||busy)return;const api=scene();if(!api?.ready)return;busy=true;fire.disabled=combo.disabled=true;drawBoard();const {pre,target}=matchup();const post=structuredClone(pre);post.ai[0].hp=Math.max(0,10-count*2);const events=[];for(let i=0;i<count;i++)events.push({type:'exchange',side:'player',from:role,to:target,attacker_uid:'U101',target_uid:'U201',serial:++serial,damage:2,attacker_hp_after:10,target_hp_after:Math.max(0,10-(i+1)*2)});
lastImpactCount=api.combatEvents?.r90ImpactTriggers||0;lastImpactIndex=-1;
send({type:'ASDC_R51_COMBAT_EVENTS',pre,post,events});qa.started++;status.textContent=count===1?'攻击中 · 等待真实命中':'三连击进行中 · 共 '+count+' 次事件';whoosh();}
function setMode(){if(busy)return;mode=mode==='on'?'off':'on';qa.mode=mode;ready=false;qa.ready=false;fire.disabled=combo.disabled=true;el('loading').hidden=false;status.textContent='切换动作时间轴，重新加载真实竞技场…';arena.src='./scene/?qa=1&r90Motion='+mode;modeButton.setAttribute('aria-pressed',String(mode==='on'));modeButton.textContent=mode==='on'?'R90 新版动作':'R89 旧版动作';banner.textContent=mode==='on'?'R90 · 命中后受击':'R89 · 攻击与受击同时开始'}
roles.forEach(([id,label,original])=>{const b=document.createElement('button');b.className='role';b.dataset.id=id;b.setAttribute('aria-pressed',String(id===role));b.innerHTML='<span>'+label+'</span><small>'+original+'</small>';b.onclick=()=>choose(id);roleButtons.append(b)});
fire.onclick=()=>play(1);combo.onclick=()=>play(3);modeButton.onclick=setMode;
const poll=()=>{const api=scene();if(!ready&&api?.ready&&api.combatEvents?.r90MotionEnabled===(mode==='on')){ready=true;qa.ready=true;qa.error=null;drawBoard();el('loading').hidden=true;fire.disabled=combo.disabled=false;status.textContent='角色就位，可以开始攻击演示';lastImpactCount=api.combatEvents?.r90ImpactTriggers||0;lastImpactIndex=-1}
if(!ready||!api)return;const data=api.combatEvents||{};
if(busy){if(mode==='on'&&data.r90ImpactTriggers>lastImpactCount){lastImpactCount=data.r90ImpactTriggers;qa.impacts++;impactSound();status.textContent='已命中！受击与特效同步触发';}else if(mode==='off'&&data.active&&data.phase>=.42&&data.index!==lastImpactIndex){lastImpactIndex=data.index;qa.impacts++;impactSound()}
if(!data.active&&data.finishedSequences>0){busy=false;fire.disabled=combo.disabled=false;qa.completed++;status.textContent='动作完成：双方回到原位，可重新演示';}
}}
setInterval(poll,80);window.addEventListener('message',e=>{if(e.source!==arena.contentWindow||e.origin!==location.origin)return;if(e.data?.type==='ASDC_R51_COMBAT_ACCEPTED'&&!e.data.accepted){busy=false;fire.disabled=combo.disabled=false;qa.error='战斗事件未被场景接受';status.textContent=qa.error}});
</script></body></html>
