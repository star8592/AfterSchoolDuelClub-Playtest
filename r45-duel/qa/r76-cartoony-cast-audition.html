<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>R76 · 高品质卡通角色原生模型对比</title>
<script type="importmap">{"imports":{"three":"../assets/three/build/three.module.js","three/addons/":"../assets/three/examples/jsm/"}}</script>
<style>html,body{background:#14253b;color:#f3f4f6;margin:0;height:100%;font-family:system-ui,sans-serif}*{box-sizing:border-box}header{padding:12px 20px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:#20374b}h1{font-size:18px;margin:0}.sub{color:#bfd2dd;font-size:12px}nav{display:flex;gap:9px;flex-wrap:wrap}label{font-size:12px;color:#bbcbda}select{background:#304962;color:#fff;padding:6px 8px;border-radius:6px;border:1px solid #6a8498;margin-left:5px}canvas{width:100%;height:calc(100vh - 210px);min-height:300px;display:block}footer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;padding:10px 18px;background:#1d344a}footer>article{padding:10px 7px;border:1px solid #59748c;border-radius:8px;background:#29455c}footer b{display:block;font-size:13px}footer small{font-size:11px;color:#ced9e2}footer em{display:block;font-size:11px;font-style:normal;color:#99dfbd;padding-top:3px}#note{background:#1e3446;font-size:11px;padding:6px 18px;color:#c7d5dc}@media(max-width:700px){header{padding:8px}h1{font-size:14px}canvas{height:calc(100vh - 245px)}footer{gap:3px;padding:3px}footer>article{padding:5px}footer b,footer small,footer em{font-size:9px}}</style></head><body><header><div><h1>R76 · 原生卡通高模 · 不修低模</h1><div class="sub">四种独立 GLB、真实 10 段动画、完整体育馆 3D 试镜 · 尚未替换正式角色</div></div><nav><label>动作<select id="motion"><option value="idle">自然待机</option><option value="wave">挥手</option><option value="cheer">欢呼</option><option value="dance">舞蹈</option><option value="angry">生气跺脚</option><option value="shrug">耸肩</option></select></label><label>视角<select id="angle"><option value="0">正面 0°</option><option value="45">45°</option><option value="90">侧面 90°</option><option value="180">背面 180°</option><option value="270">270°</option></select></label><label>场景<select id="venue"><option value="gym">体育馆</option><option value="studio">独立试镜</option></select></label></nav></header>
<canvas id="stage"></canvas><footer id="labels"></footer><div id="note">原作视觉匹配与原始作者产权链需二次确认；这里展示原始真实模型与动作，不添加程序化低模或人工增面。顶部切换动作、机位、体育馆背景。</div>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {createStadium} from '../scene/stadium.mjs';
const $=id=>document.getElementById(id),query=new URLSearchParams(location.search);
const initial={motion:['idle','wave','cheer','dance','angry','shrug'].includes(query.get('motion'))?query.get('motion'):'idle',angle:[0,45,90,180,270].includes(Number(query.get('angle')))?Number(query.get('angle')):0,venue:query.get('venue')==='studio'?'studio':'gym'};
for(const id of ['motion','angle','venue']){$(id).value=String(initial[id]);$(id).addEventListener('change',()=>{const p=new URLSearchParams(location.search);p.set(id,$(id).value);location.search=p.toString()})}
const entries=[
 {id:'cafeteria_aunt',label:'食堂阿姨 · 圆润体型',link:'https://vibeassets.io/a/4yhw0ja37h'},
 {id:'sports_teacher',label:'体育壮汉 · 夸张比例',link:'https://vibeassets.io/a/vr9ojdtnca'},
 {id:'elderly_dancer',label:'年长舞者 · 表情基底',link:'https://vibeassets.io/a/anpj9kswp2'},
 {id:'school_announcer',label:'舞台主持人 · 职业形象',link:'https://vibeassets.io/a/tm1p0ui12r'}
];
const scene=new THREE.Scene();scene.background=new THREE.Color('#172c43');scene.add(new THREE.HemisphereLight('#f5f7ff','#a9b0be',2.2));const key=new THREE.DirectionalLight('#ffeccc',2.5);key.position.set(-4,8,7);scene.add(key);const rim=new THREE.DirectionalLight('#b3d9ff',.85);rim.position.set(4,5,-4);scene.add(rim);
const gym=initial.venue==='gym';if(gym)createStadium(THREE,scene,{detail:'low'});else{const plane=new THREE.Mesh(new THREE.PlaneGeometry(26,8),new THREE.MeshStandardMaterial({color:'#395973',roughness:1}));plane.rotation.x=-Math.PI/2;plane.position.y=-.012;scene.add(plane)}
const canvas=$('stage');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;renderer.setPixelRatio(Math.min(1.3,devicePixelRatio||1));
const focus=query.get('focus');const camera=new THREE.PerspectiveCamera(40,1,.1,100);
const position=()=>{const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();camera.position.set(0,gym?2.42:2.50,focus?5.3:w<700?28:gym?13:10.5);camera.lookAt(0,gym?1.22:1.15,gym?-.55:0)};position();addEventListener('resize',position);
const results=[];const positions=[-4.20,-1.45,1.45,4.20];let loadErrors=[];
for(const [i,e] of entries.entries()){
 if(focus&&e.id!==focus)continue;
 try{
  const gltf=await new GLTFLoader().loadAsync(e.id==='cafeteria_aunt'?
    '../assets/summons/M02-CafeteriaAunt-CartoonR76.glb':`../art-lab/r76-cartoon-cast/sources/${e.id}.glb`);
  const actor=gltf.scene,box=new THREE.Box3().setFromObject(actor,true),size=box.getSize(new THREE.Vector3());
  if(box.isEmpty()||size.y<.6||size.y>10)throw Error('Source bounds not standing human '+size.y);
  const root=new THREE.Group(),holder=new THREE.Group();root.position.x=focus?0:positions[i];root.rotation.y=initial.angle*Math.PI/180;scene.add(root);root.add(holder);holder.scale.setScalar(2.08/size.y);holder.add(actor);actor.position.set(-(box.min.x+box.max.x)/2,-box.min.y,-(box.min.z+box.max.z)/2);
  // The mesh's manufacturer authored ten real source animation clips.
  const matches={idle:['Idle'],wave:['Big_Wave_Hello'],cheer:['Cheer_with_Both_Hands_Up','Motivational_Cheer'],dance:['FunnyDancing_01'],angry:['Angry_Stomp','Finger_Wag_No'],shrug:['Shrug']};
  const clip=gltf.animations.find(x=>matches[initial.motion].includes(x.name))||gltf.animations.find(x=>x.name==='Idle');
  if(!clip)throw Error('No native action clips in original '+e.id);
  const mixer=new THREE.AnimationMixer(actor),action=mixer.clipAction(clip);action.setLoop(THREE.LoopRepeat);action.play();
  let meshes=0,skins=0,bones=0,triangles=0;actor.traverse(o=>{if(o.isMesh){meshes++;const g=o.geometry;triangles+=(g.index?g.index.count:g.attributes.position.count)/3;}if(o.isSkinnedMesh)skins++;if(o.isBone)bones++;});
  const skeleton=actor.getObjectByName('Head')||actor.getObjectByName('mixamorigHead')||actor.getObjectByName('Hips');
  const b0=skeleton?.quaternion.clone();results.push({id:e.id,source:e.link,root,actor,mixer,clip:clip.name,animations:gltf.animations.map(c=>c.name),bones,skins,meshes,triangles:Math.round(triangles),size:[size.x,size.y,size.z],anchor:skeleton,startQuat:b0,observedMotion:0,frames:0,pass:skins>=1&&bones>=20&&gltf.animations.length>=9});
  $('labels').insertAdjacentHTML('beforeend',`<article><b>${e.label}</b><small>${Math.round(triangles).toLocaleString()} triangles · ${bones} 根骨骼</small><em>${clip.name} · ${gltf.animations.length} 原生动作</em></article>`);
 }catch(error){loadErrors.push(e.id+': '+String(error));console.error('R76_SOURCE_IMPORT_FAILED',e.id,error);$('labels').insertAdjacentHTML('beforeend',`<article><b>${e.label}</b><small>加载未通过：${error}</small></article>`)}
}
const clock=new THREE.Clock();let frames=0;renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.045);for(const m of results){m.mixer.update(dt);m.frames++;if(m.anchor&&m.startQuat){m.observedMotion=Math.max(m.observedMotion,m.startQuat.angleTo(m.anchor.quaternion))}}renderer.render(scene,camera);frames++});
window.__R76_CAST_QA={ready:true,get frames(){return frames},motion:initial.motion,angle:initial.angle,venue:initial.venue,get errors(){return loadErrors},get characters(){return results.map(({id,source,clip,animations,bones,skins,meshes,triangles,size,observedMotion,frames,pass})=>({id,source,clip,animationCount:animations.length,bones,skins,meshes,triangles,sourceHeight:size[1],observedMotion:+observedMotion.toFixed(5),frames,pass}))}};
</script></body></html>
