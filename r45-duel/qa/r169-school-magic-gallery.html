<!doctype html>
<html lang="zh-Hans"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:,">
<title>R169 校园荒诞实体魔法 · 46 张独立身份</title>
<script type="importmap">{"imports":{"three":"../assets/three/build/three.module.js","three/addons/":"../assets/three/examples/jsm/"}}</script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#0d1828;color:#eff4fa;font-family:system-ui,"Noto Sans CJK SC",sans-serif}
header{padding:24px 4%;background:#1a2a3d;border-bottom:1px solid #537488}
h1{font-size:25px;color:#ffe1a2;margin:0}header p{font-size:14px;color:#cbd8e0;line-height:1.7}
main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;padding:18px;max-width:1440px;margin:auto}
aside{padding:17px;border:1px solid #4c6374;background:#1b2d41;border-radius:12px}
label,select{display:block;width:100%;margin:9px 0;padding:11px;font-size:15px}
select{background:#0d1f2f;color:white;border:1px solid #7c99ae;border-radius:8px}
button{background:#e7bb76;color:#202b36;border:0;border-radius:8px;padding:12px;font-weight:800;cursor:pointer;width:100%}
aside p{font-size:14px;line-height:1.8;color:#d1dce9}
#name{color:#ffe5ad}
.stage{height:600px;border:1px solid #536e82;background:#243548;border-radius:10px;position:relative;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.tag{position:absolute;top:12px;left:12px;padding:7px 11px;border-radius:6px;background:#152638dd;color:#ffe2ad;font-size:12px}
@media(max-width:810px){main{grid-template-columns:1fr}.stage{height:420px;order:1}aside{order:2}}
</style></head><body>
<header><h1>R169 · 校园荒诞魔法 · 实体道具演出</h1>
<p>真实 WebGL2 · 46 张现役魔法均独立定义。光效只是陪衬，主角是校园道具、事件与反应。本页为独立艺术原型：台词未录制、人物骨骼动作仍需精修，正式 R147 不受影响。</p></header>
<main><aside><label for="card">选择一张法术牌</label><select id="card"></select>
<button id="next">下一张（实际3D演出）</button><h2 id="name"></h2>
<p id="concept"></p><p id="voices"></p><p id="status"></p></aside>
<div class="stage"><canvas id="fx" aria-label="校园荒诞实体3D魔法演示"></canvas>
<div class="tag">物理道具优先 · 零通用魔法光圈 · 仅视觉研发</div></div></main>
<script type="module">
import * as THREE from 'three';
import {CARDS} from '../engine.mjs';
import {SCHOOL_MAGIC_IDENTITIES} from '../scene/campus-magic-bible.mjs';
import {createCampusSchoolMagic} from '../scene/campus-school-magic.mjs';
const spells=CARDS.filter(c=>c.kind==='spell');
const select=document.querySelector('#card');
for(const [i,card] of spells.entries()){
 const opt=document.createElement('option');opt.value=i;
 opt.textContent=card.id+' · '+card.name;
 select.append(opt);
}
const canvas=document.querySelector('#fx'),stage=canvas.parentElement;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.24;
const scene=new THREE.Scene();scene.background=new THREE.Color('#25384b');
scene.add(new THREE.HemisphereLight('#ffffff','#425060',2.10));
const key=new THREE.DirectionalLight('#f5d8ae',2.4);key.position.set(2,9,8);scene.add(key);
const camera=new THREE.PerspectiveCamera(45,1,.1,50);
camera.position.set(0,2.88,4.85);camera.lookAt(0,1.36,0);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(5.6,5.9,.22,48),
 new THREE.MeshStandardMaterial({color:'#58717c',roughness:.83}));
floor.position.y=-.26;scene.add(floor);
const magic=createCampusSchoolMagic(THREE,scene);
const clock=new THREE.Clock(),origin=()=>clock.getElapsedTime();
let serial=1,card=null,t=0;
function resize(){
 const b=stage.getBoundingClientRect();
 const w=Math.max(320,Math.round(b.width)),h=Math.max(260,Math.round(b.height));
 renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);resize();
function cast(){
 const id=spells[Number(select.value)||0].id;
 card=SCHOOL_MAGIC_IDENTITIES[id];t=origin();
 magic.update(t+100);
 const v=magic.play({type:'ASDC_R81_SPELL_RESULT',card:id,
  effect:spells[Number(select.value)||0].effect,side:'ai',
  serial:serial++,directDamage:0,damage:0},t);
 if(!v)throw Error('R169 invalid spell '+id);
 for(const child of magic.root.children)child.position.x=0;
 document.querySelector('#name').textContent=id+' · '+card.originalName;
 document.querySelector('#concept').textContent='实体：'+card.prop+' ｜施法：'+card.gesture+
   ' ｜轨迹：'+card.flight+' ｜反馈：'+card.impact;
 document.querySelector('#voices').textContent='专属台词脚本（未配音）：'+card.lines.cast+
   ' ｜命中：'+card.lines.hit+' ｜观众：'+card.lines.audience;
}
function frame(){
 const now=origin();magic.update(now);
 renderer.render(scene,camera);
 document.querySelector('#status').textContent='已渲染不同实体：'+magic.stats.uniqueRenderedProps+
 ' ｜缓存几何：'+magic.stats.cacheGeometries+' ｜当前模型：'+magic.stats.active+
 ' ｜额外点光源：'+magic.stats.shaderPointLights;
 requestAnimationFrame(frame);
}
function exactSnapshot(id,age=.37){
 const idx=spells.findIndex(c=>c.id===id);if(idx<0)return null;
 const item=spells[idx],info=SCHOOL_MAGIC_IDENTITIES[id];
 const base=4000+idx*4;
 magic.update(base);
 const accepted=magic.play({type:'ASDC_R81_SPELL_RESULT',card:id,
  effect:item.effect,side:'ai',serial:170000+idx,damage:0,directDamage:0},base);
 if(!accepted)return null;
 for(const child of magic.root.children)child.position.x=0;
 magic.update(base+age);
 renderer.render(scene,camera);
 const active=magic.root.children.at(-1);
 let meshCount=0;active.traverse(o=>{if(o.isMesh)meshCount++});
 const signature=[];active.traverse(o=>{if(o.isMesh)signature.push(o.geometry?.type)});
 return {id,name:item.name,identity:info,meshCount,signature,
  stats:magic.stats,drawCalls:renderer.info.render.calls,
  image:canvas.toDataURL('image/png')};
}
window.__r169SchoolMagicQA={castId(id){const i=spells.findIndex(c=>c.id===id);
 if(i<0)return false;select.selectedIndex=i;cast();return true},
 renderFixed:exactSnapshot,get stats(){return magic.stats},
 get cardCount(){return spells.length},
 get trueModels(){return magic.root.children.length}};
document.querySelector('#next').onclick=()=>{select.selectedIndex=(select.selectedIndex+1)%spells.length;cast()};
select.onchange=cast;select.selectedIndex=0;cast();
if(new URLSearchParams(location.search).get('r169Snapshot')==='on')
 renderer.render(scene,camera);
else frame();
</script></body></html>
