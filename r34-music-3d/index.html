<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>R34 音乐老师 · 真实三维模型验收</title>
<style>
:root{font-family:system-ui,"Noto Sans SC",sans-serif;color-scheme:dark;background:#101016;color:#f2e7d6}*{box-sizing:border-box}
body{margin:0;min-height:100vh}header{padding:18px 26px;border-bottom:1px solid #3c3443;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
h1{margin:0;font-size:22px}header small{color:#ddae85}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:calc(100vh - 75px)}
.stage{position:relative;min-height:610px;background:radial-gradient(circle at 50% 40%,#383042,#12121c 65%)}canvas{display:block;width:100%;height:100%;touch-action:none}
.controls{position:absolute;left:16px;bottom:16px;right:16px;display:flex;gap:8px;flex-wrap:wrap}
button,input{font:inherit}button{cursor:pointer;background:#342c3c;border:1px solid #b79065;color:#ffe8bc;border-radius:6px;padding:8px 11px}
button:hover{background:#55415b}.status{position:absolute;top:16px;left:16px;max-width:85%;padding:9px 13px;background:#12121ecc;border:1px solid #6b5263;border-radius:8px;line-height:1.5}
aside{background:#1a1822;padding:24px;border-left:1px solid #49354c;line-height:1.6}aside h2{font-size:18px;margin-top:0}
dl{display:grid;grid-template-columns:1fr auto;gap:6px 10px}dt{color:#b7aabb}dd{margin:0;font-variant-numeric:tabular-nums}
.notice{color:#eec39d;font-size:13px;border-top:1px solid #443546;padding-top:14px;margin-top:20px}
input[type=file]{display:block;width:100%;font-size:13px;margin-top:15px}
@media(max-width:850px){.layout{display:flex;flex-direction:column}.stage{height:66vh;min-height:400px}aside{border-left:0;border-top:1px solid #49354c}}
</style></head>
<body>
<header><h1>音乐老师 · R34 三维模型验收</h1><small>技术原型 · 艺术未批准 · 不属于正式18卡</small></header>
<div class="layout"><section class="stage" id="stage" aria-label="可旋转3D模型视窗">
<div id="status" class="status">正在检查真实 GLB 资源…</div>
<div class="controls"><button data-view="front">正面</button><button data-view="right">右侧</button><button data-view="back">背面</button><button data-view="left">左侧</button><button data-view="three">45°</button><button id="turn">自动旋转：关</button><button id="wire">线框：关</button></div>
</section><aside><h2>真实几何检查</h2><p>可拖动旋转、滚轮缩放。点击不同视角检查头发、衣摆、肢体与背部结构。</p>
<dl><dt>模型类型</dt><dd id="type">—</dd><dt>三角面数</dt><dd id="tris">—</dd><dt>网格数</dt><dd id="meshes">—</dd><dt>骨骼数</dt><dd id="bones">—</dd><dt>蒙皮网格</dt><dd id="skinned">—</dd><dt>动画片段</dt><dd id="anims">—</dd><dt>贴图数</dt><dd id="tex">—</dd></dl>
<label>本机 GLB 人工核验（可选）<input id="file" type="file" accept=".glb,model/gltf-binary"></label>
<div class="notice">只有真实网格才可在本页展示。生成 GLB 不等于完成角色：尚需正侧背外观比对、骨骼蒙皮、指挥棒动作、战斗接入与美术批准。此页不使用 2.5D 图画代替模型。</div></aside></div>
<script type="module">
import * as THREE from "https://esm.sh/three@0.165.0";
import {OrbitControls} from "https://esm.sh/three@0.165.0/examples/jsm/controls/OrbitControls.js";
import {GLTFLoader} from "https://esm.sh/three@0.165.0/examples/jsm/loaders/GLTFLoader.js";
const el=document.getElementById('stage'),status=document.getElementById('status');
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(36,1,.01,400);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio,2));
el.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5e9ff,0x423445,2.5));
const key=new THREE.DirectionalLight(0xffdfc0,3.2);key.position.set(4,7,8);scene.add(key);
const rim=new THREE.DirectionalLight(0xa6b9ff,2.1);rim.position.set(-4,4,-6);scene.add(rim);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=.6;controls.maxDistance=40;
let model=null,auto=false,wire=false,center=new THREE.Vector3(),radius=2;
const $=id=>document.getElementById(id);const put=(k,v)=>$(k).textContent=v;
const setView=name=>{const d=radius*2.9,angles={front:[0,0,d],right:[d,0,0],back:[0,0,-d],left:[-d,0,0],three:[d*.72,d*.25,d*.72]};let a=angles[name]||angles.three;camera.position.copy(center).add(new THREE.Vector3(...a));controls.target.copy(center);controls.update()};
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
$('turn').onclick=()=>{auto=!auto;controls.autoRotate=auto;put('turn','自动旋转：'+(auto?'开':'关'))};
$('wire').onclick=()=>{wire=!wire;model?.traverse(o=>{if(o.isMesh){const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>{if(m)m.wireframe=wire})}});put('wire','线框：'+(wire?'开':'关'))};
function fit(){
 const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3());box.getCenter(center);radius=Math.max(size.length()*.6,.7);controls.minDistance=radius*.35;controls.maxDistance=radius*12;camera.near=Math.max(.001,radius/1000);camera.far=radius*40;camera.updateProjectionMatrix();setView('three');
}
async function load(url){
 status.textContent='加载真实三维网格…';const gltf=await new GLTFLoader().loadAsync(url);
 if(model)scene.remove(model);model=gltf.scene;scene.add(model);
 let meshes=0,tris=0,bones=0,skinned=0,tex=new Set(),materials=new Set();model.traverse(o=>{
  if(o.isBone)bones++;
  if(o.isMesh){meshes++;if(o.isSkinnedMesh)skinned++;const geo=o.geometry;const p=geo.index?geo.index.count:geo.attributes.position.count;tris+=Math.floor(p/3);
   for(const m of Array.isArray(o.material)?o.material:[o.material]){if(m){materials.add(m);for(const v of Object.values(m))if(v&&v.isTexture)tex.add(v)}}}});
 put('type','GLB / glTF 2.0');put('tris',tris.toLocaleString());put('meshes',meshes);put('bones',bones);put('skinned',skinned);put('anims',gltf.animations.length);put('tex',tex.size);
 fit();status.textContent='真实 GLB 已加载 · '+(bones&&skinned?'含蒙皮骨骼':'当前未具备蒙皮骨骼')+' · ART_APPROVED=false';
 window.__M01_QA={loaded:true,meshes,tris,bones,skinned,animations:gltf.animations.length,textures:tex.size};
}
$('file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;const url=URL.createObjectURL(f);try{await load(url)}catch(err){status.textContent='本地 GLB 读取失败：'+err.message}finally{URL.revokeObjectURL(url)}});
window.addEventListener('resize',resize);
function resize(){const w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
resize();const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{controls.update(clock.getDelta());renderer.render(scene,camera)});
load('./model/M01_candidate.glb').catch(err=>{status.textContent='本轮模型尚未生成或载入失败：'+err.message;window.__M01_QA={loaded:false,error:String(err)}});
</script></body></html>
