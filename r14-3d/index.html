<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090f1d">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>放学后决斗社 · 真实 GLB 双人 3D 战斗预览</title>
<style>
:root{font-family:system-ui,"Noto Sans SC","PingFang SC",sans-serif;color:#f4f1ea;background:#080d17;color-scheme:dark}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:#090f19}
main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh;width:100vw}
header{min-height:64px;padding:9px clamp(12px,2vw,30px);display:flex;align-items:center;gap:14px;justify-content:space-between;
 border-bottom:1px solid #3a4555;background:#101a29}
header h1{font-size:clamp(16px,2.3vw,27px);line-height:1.25;margin:0 0 2px}
header p{font-size:clamp(10px,1vw,13px);color:#bbc6d7;margin:0}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{border:1px solid #889bb0;background:#223449;color:#fff;min-height:38px;border-radius:8px;
 padding:8px 14px;font:600 13px system-ui;cursor:pointer}
button:focus-visible{outline:3px solid #efcc8b}
button.primary{background:#dfb877;color:#1b2535;border-color:#dfb877}
.stage{position:relative;width:100%;height:100%;min-height:0;isolation:isolate;background:#090f19}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#090f19}
#loading{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;
 background:#090f19;color:#d6e4f0;font-size:clamp(14px,1.6vw,21px);z-index:2}
#loading[hidden]{display:none}
#quality{position:absolute;left:12px;bottom:12px;z-index:1;
 padding:6px 10px;font-size:11px;max-width:calc(100% - 24px);border-radius:7px;
 background:rgba(4,9,17,.74);color:#d1e1ed;border:1px solid #5c718b;
 pointer-events:none;text-shadow:0 1px 4px black}
footer{display:flex;align-items:center;justify-content:space-between;gap:8px;
 padding:7px clamp(12px,2vw,30px);background:#101a29;border-top:1px solid #3a4555;
 font-size:11px;color:#aebccd;min-height:34px}
#status{color:#bbe5d4;font-weight:700}
button[aria-pressed="true"]{outline:1px solid #dfb877}
@media(max-width:720px){
 header{min-height:82px;align-items:flex-start;gap:5px;flex-direction:column;padding:7px 11px}
 header h1{font-size:17px}header p{font-size:10px}
 .controls{gap:5px}button{min-height:29px;font-size:10px;padding:5px 8px}
 footer{padding:5px 9px;font-size:9px}
 #quality{font-size:9px;bottom:5px;left:5px}
}
</style>
</head>
<body>
<main>
<header>
<div>
<h1>放学后决斗社 · 双人真实 3D 战斗</h1>
<p>E01「铃声追不上」 × G01「橡皮筋建筑师」 · 原创 GLB 骨骼动画 · WebGL2</p>
</div>
<div class="controls">
<button id="camera-close" type="button" class="primary" aria-pressed="true">人物近景</button>
<button id="camera-wide" type="button" aria-pressed="false">双人全景</button>
<button class="primary" id="replay" type="button">重新播放</button>
<button id="reload" type="button">重新加载 3D</button>
</div>
</header>
<section class="stage" aria-label="实时3D骨骼动画场景">
<iframe id="real3d" title="实际 E01 和 G01 两名校园 GLB 骨骼三维角色战斗" loading="eager"
  referrerpolicy="no-referrer" src="about:blank"></iframe>
<div id="loading" role="status">正在加载真实的两套 GLB 角色与 WebGL3D 场景…</div>
<div id="quality">真实三维模型与骨骼动画 · 当前角色仍为程序化造型研发原型，未达到最终原画品质</div>
</section>
<footer><span id="status">检查 WebGL2 与角色资源…</span><span>R16 实际骨骼近景 / 全景切换 · 仅研发美术 · 无背景音乐</span></footer>
</main>
<script type="module">
const frame=document.getElementById('real3d');
const loading=document.getElementById('loading');
const status=document.getElementById('status');
const btnReplay=document.getElementById('replay');
const cameraClose=document.getElementById('camera-close');
const cameraWide=document.getElementById('camera-wide');
const DEMO=Object.freeze({
 type:'ASDC_R14_LIVE_EXCHANGE',mode:'demo',actor:'E01',target:'G01',
 source:'INDEPENDENT_CORE_GENERATED_DEMO_NOT_CURRENT_MATCH',
 autoplayVoice:false,previewArtApproved:false
});
const SCENE='./labs/duel-motion-r01/index.html?embedLiveR14=on&soleR13=on&fightFXR14=on&cameraR09=on&cameraSafetyR13=on&campusGymR07=on&lookR10=on&lightR11=on&actorFirstR16=on&sourceR16=144db49';
let ready=false,accepted=false,generation=0,loop=null,deadline=null;
let cameraMode='duo-close';
const qa={realGLBReady:false,playing:false,rigs:0,artApproved:false,sceneReadySignal:false,loadErrors:[]};
Object.defineProperty(window,'__r15Public3DQA',{value:qa});
function report(msg){status.textContent=msg;}
function play(){
 if(!ready||!frame.contentWindow)return;
 frame.contentWindow.postMessage(DEMO,location.origin);
 report('实际 GLB 骨骼动画播放中…');
}
function chooseCamera(mode){
 if(mode!=='duo-close'&&mode!=='wide')return;
 cameraMode=mode;
 cameraClose.setAttribute('aria-pressed',String(mode==='duo-close'));
 cameraWide.setAttribute('aria-pressed',String(mode==='wide'));
 cameraClose.classList.toggle('primary',mode==='duo-close');
 cameraWide.classList.toggle('primary',mode==='wide');
 if(ready&&frame.contentWindow?.__duelMotionQA?.setCameraStyleR16){
  const result=frame.contentWindow.__duelMotionQA.setCameraStyleR16(mode);
  if(!result?.realGLTF||result.artApproved!==false)
    throw Error('R16 character-first camera must be actual 3D');
  report(mode==='duo-close'?'人物近景 · 真实 GLB 镜头':'双人全景 · 真实 GLB 镜头');
 }
}
cameraClose.addEventListener('click',()=>chooseCamera('duo-close'));
cameraWide.addEventListener('click',()=>chooseCamera('wide'));
function load(){
 generation++;ready=false;accepted=false;qa.playing=false;qa.realGLBReady=false;
 loading.hidden=false;loading.textContent='正在加载真实 GLB 角色、骨骼与 Three.js WebGL…';
 report('加载 3D 场景…');
 clearTimeout(loop);clearTimeout(deadline);
 const current=generation;
 deadline=setTimeout(()=>{
  if(generation===current&&!accepted){
   const message='WebGL 3D 加载失败，请使用支持 WebGL2 的浏览器重试。';
   loading.textContent=message;report(message);qa.loadErrors.push(message);
  }
 },20000);
 frame.src=SCENE;
}
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==frame.contentWindow)return;
 const d=event.data;
 if(d?.type==='ASDC_R14_3D_READY'&&d.originalGLBRigs===2&&d.artApproved===false){
  ready=true;qa.sceneReadySignal=true;qa.rigs=2;qa.realGLBReady=true;chooseCamera(cameraMode);play();
 }else if(d?.type==='ASDC_R14_3D_ACCEPTED'&&d.mode==='demo'&&d.artApproved===false){
  accepted=true;qa.playing=true;qa.artApproved=false;
  loading.hidden=true;clearTimeout(deadline);clearTimeout(loop);
  report('实时 WebGL 3D 演出进行中 · 两名 GLB 人物已加载');
  loop=setTimeout(()=>{if(ready)play();},8000);
 }
});
btnReplay.addEventListener('click',()=>ready?play():load());
document.getElementById('reload').addEventListener('click',load);
load();
</script>
</body>
</html>
